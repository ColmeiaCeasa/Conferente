<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conferência Digital Colméia</title>
  
  <meta name="theme-color" content="#075E54">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/VNQ8ywFQ/Sem-titulo-1.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/VNQ8ywFQ/Sem-titulo-1.png">

  <style>
    html, body { 
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      font-family: 'Segoe UI', sans-serif; 
      background: #f0f2f5; color: #333;
    }
    
    .header-fixed { 
      position: fixed; top: 0; width: 100%;
      background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
      z-index: 100; padding: 4px 0 0 0; 
    }
    .container { max-width: 500px; margin: auto; padding: 0 10px; }
    
    .logo-container { text-align: center; margin-bottom: 0px; }
    .logo-container img { max-height: 26px; width: auto; }

    h1 { 
      color: #075E54; font-size: 13px; text-align: center; 
      margin: 1px 0 3px 0; font-weight: bold; 
    }

    .header-info { 
      background: #f9f9f9; padding: 4px 6px; border-radius: 6px; 
      border: 1px solid #eee; font-size: 11px; margin-bottom: 4px; 
    }
    
    select, textarea { width: 100%; padding: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; box-sizing: border-box; }
    
    .search-container { position: relative; margin-top: 3px; }
    .search-input { 
      width: 100%; padding: 5px 30px 5px 8px; border-radius: 6px; 
      border: 1px solid #25D366; font-size: 13px; box-sizing: border-box;
    }
    .btn-clear-search {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: #ccc; color: white; border: none; border-radius: 50%;
      width: 18px; height: 18px; font-size: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .tabs-container { display: flex; background: white; border-top: 1px solid #eee; }
    .tab-btn { 
      flex: 1; padding: 4px 1px; border: none; background: transparent; 
      font-size: 10px; font-weight: bold; color: #888; cursor: pointer; 
      border-bottom: 3px solid transparent; transition: all 0.3s;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
    }
    .tab-btn.active { color: #075E54; border-bottom: 3px solid #25D366; background: #f0fdf4; }
    .tab-icon { font-size: 12px; } 

    /* Lógica das 5 abas */
    .modo-estoque .box-entrada, .modo-estoque .box-saida, .modo-estoque .box-reposicao, .modo-estoque .box-quebra { display: none !important; }
    .modo-entrada .box-estoque, .modo-entrada .box-saida, .modo-entrada .box-reposicao, .modo-entrada .box-quebra { display: none !important; }
    .modo-saida .box-estoque, .modo-saida .box-entrada, .modo-saida .box-reposicao, .modo-saida .box-quebra { display: none !important; }
    .modo-reposicao .box-estoque, .modo-reposicao .box-entrada, .modo-reposicao .box-saida, .modo-reposicao .box-quebra { display: none !important; }
    .modo-quebra .box-estoque, .modo-quebra .box-entrada, .modo-quebra .box-saida, .modo-quebra .box-reposicao { display: none !important; }

    .scrollable-content { 
      position: absolute;
      top: 135px; 
      bottom: 125px; 
      left: 0; right: 0;
      overflow-y: auto; 
      padding: 6px 0;
    }

    .item-row { 
      background: white; border-radius: 6px; margin-bottom: 4px; padding: 6px 10px; 
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: background 0.2s;
      font-size: 13px;
    }

    .item-preenchido { background: #e8f5e9 !important; border: 1px solid #25D366; }
    .input-quebra-ativa { background-color: #ffebee !important; border: 2px solid #d32f2f !important; color: #d32f2f; font-weight: bold; }

    .inputs-group { display: flex; gap: 6px; }
    .input-box { display: flex; flex-direction: column; align-items: center; }
    .input-box label { font-size: 9px; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
    input[type="number"] { width: 65px; padding: 5px; border: 1px solid #ddd; border-radius: 5px; text-align: center; font-size: 14px; transition: 0.3s; }

    .footer-fixed { 
      position: fixed; bottom: 0; width: 100%;
      background: white; border-top: 1px solid #ddd;
      padding: 6px 0 8px 0; z-index: 100; box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
    }
    .btn-enviar { 
      width: 90%; max-width: 470px; display: block; margin: auto; 
      padding: 10px; background: #25D366; color: white; 
      border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    
    .btn-limpar {
      width: 90%; max-width: 470px; display: block; margin: 4px auto 0 auto; 
      padding: 6px; background: transparent; color: #d32f2f; 
      border: 1px solid #d32f2f; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    
    .obs-container { width: 90%; max-width: 470px; margin: 0 auto 5px auto; }
    .obs-container label { font-size: 11px; }
    .obs-container textarea { font-size: 12px; padding: 5px; resize: none; }

    .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
    .modal-content { background: white; margin: 10% auto; padding: 15px; border-radius: 10px; width: 85%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
    .revisao-texto { white-space: pre-wrap; background: #f4f4f4; padding: 10px; border-radius: 6px; font-size: 12px; margin: 10px 0; border: 1px solid #ddd; }
    .modal-btns { display: flex; gap: 8px; }
    .btn-confirmar { flex: 2; background: #25D366; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-corrigir { flex: 1; background: #666; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

<div class="header-fixed">
  <div class="container">
    <div class="logo-container">
      <img src="https://i.postimg.cc/Mp43sV46/LOGO-COLMEIA.png" alt="Logo Colméia">
    </div>

    <h1>Conferência Digital Colméia</h1>

    <div class="header-info">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span><b>📅</b> <span id="dataHoraAtual"></span></span>
        <select id="selectConferente" style="width: 55%; padding: 4px; font-size: 12px;">
          <option value="">👤 Conferente...</option>
        </select>
      </div>
      
      <div class="search-container">
        <input type="text" id="inputBusca" class="search-input" placeholder="🔍 Buscar produto ou código..." onkeyup="filtrarProdutos()">
        <button class="btn-clear-search" onclick="limparBusca()">✕</button>
      </div>
    </div>
  </div>
  
  <div class="tabs-container">
    <button class="tab-btn active" id="btnEstoque" onclick="mudarAba('estoque')">
      <span class="tab-icon">📦</span> Estoque
    </button>
    <button class="tab-btn" id="btnEntrada" onclick="mudarAba('entrada')">
      <span class="tab-icon" style="color: #25D366;">⬇️</span> Entrada
    </button>
    <button class="tab-btn" id="btnSaida" onclick="mudarAba('saida')">
      <span class="tab-icon" style="color: #d32f2f;">⬆️</span> Saída
    </button>
    <button class="tab-btn" id="btnReposicao" onclick="mudarAba('reposicao')">
      <span class="tab-icon" style="color: #1976D2;">🔄</span> Reposição
    </button>
    <button class="tab-btn" id="btnQuebra" onclick="mudarAba('quebra')">
      <span class="tab-icon">⚠️</span> Quebra
    </button>
  </div>
</div>

<div class="scrollable-content">
  <div class="container">
    <div id="listaProdutos" class="modo-estoque">
      <p style="text-align:center;">⏳ Buscando produtos...</p>
    </div>
  </div>
</div>

<div class="footer-fixed">
  <div class="obs-container">
    <label style="font-weight:bold; color: #555;">📝 Observações:</label>
    <textarea id="obsGeral" rows="1" placeholder="Notas da carga..."></textarea>
  </div>
  <button class="btn-enviar" onclick="abrirRevisao()">📋 Revisar e Enviar</button>
  
  <button class="btn-limpar" onclick="confirmarLimpeza()">🗑️ Limpar Tudo</button>
</div>

<div id="modalRevisao" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0; font-size: 16px;">Revisar Relatório</h3>
    <div id="corpoRevisao" class="revisao-texto"></div>

    <div class="modal-btns">
      <button class="btn-corrigir" onclick="fecharRevisao()">Alterar</button>
      <button class="btn-confirmar" onclick="confirmarEEnviar()">Confirmar no App</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVzqQ1W5Zr4eut65ssGjZ2KVaCGoPczfAMlHG7ZvbMpJbc48YP047Q7MQ4twP_NMNV/exec";

  let dadosProdutos = [];
  let mensagemFinal = "";

  function atualizarDataHora() {
    const agora = new Date();
    const formato = agora.toLocaleDateString('pt-BR') + " " + agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
    document.getElementById('dataHoraAtual').innerText = formato;
  }
  
  atualizarDataHora();
  setInterval(atualizarDataHora, 60000);

  function mudarAba(aba) {
    const lista = document.getElementById('listaProdutos');
    lista.className = `modo-${aba}`;

    ['estoque', 'entrada', 'saida', 'reposicao', 'quebra'].forEach(id => {
      const btnId = `btn${id.charAt(0).toUpperCase() + id.slice(1)}`;
      document.getElementById(btnId).classList.toggle('active', id === aba);
    });
  }

  function checkInput(index) {
    const estoque = document.getElementById(`estoque-${index}`).value || 0;
    const entrada = document.getElementById(`ent-${index}`).value || 0;
    const saida = document.getElementById(`sai-${index}`).value || 0;
    const reposicao = document.getElementById(`rep-${index}`).value || 0;
    const qbrInput = document.getElementById(`qbr-${index}`);
    const qbrValue = qbrInput.value || 0;
    
    const row = document.getElementById(`row-${index}`);
    
    row.classList.toggle('item-preenchido', (estoque > 0 || entrada > 0 || saida > 0 || reposicao > 0 || qbrValue > 0));
    
    if (qbrValue > 0) {
      qbrInput.classList.add('input-quebra-ativa');
    } else {
      qbrInput.classList.remove('input-quebra-ativa');
    }
  }

  function filtrarProdutos() {
    const termo = document.getElementById('inputBusca').value.toLowerCase();
    const rows = document.getElementsByClassName('item-row');
    Array.from(rows).forEach(row => {
      const texto = row.innerText.toLowerCase();
      row.style.display = texto.includes(termo) ? "flex" : "none";
    });
  }

  function limparBusca() {
    const input = document.getElementById('inputBusca');
    input.value = "";
    filtrarProdutos();
    input.focus();
  }

  async function carregarDados() {
    const lista = document.getElementById('listaProdutos');
    const select = document.getElementById('selectConferente');

    try {
      lista.innerHTML = `<p style="text-align:center;">⏳ Carregando produtos...</p>`;
      
      const response = await fetch(SCRIPT_URL + "?get=produtos", {
        method: "GET",
        redirect: "follow"
      });

      const textoResposta = await response.text();
      let data;
      
      try {
        data = JSON.parse(textoResposta);
      } catch(err) {
        throw new Error("A resposta da planilha não veio em formato JSON. Verifique se a permissão de acesso no Apps Script está como 'Qualquer pessoa'.");
      }

      if (data.status === "erro") {
        throw new Error("Erro interno na planilha: " + data.mensagem);
      }

      select.innerHTML = '<option value="">👤 Conferente...</option>';
      if (data.conferentes && Array.isArray(data.conferentes)) {
        data.conferentes.forEach(nome => {
          let opt = document.createElement('option');
          opt.value = nome; 
          opt.text = nome; 
          select.appendChild(opt);
        });
      }

      dadosProdutos = data.produtos || [];
      
      if (dadosProdutos.length === 0) {
        lista.innerHTML = '<p style="text-align:center;">Nenhum produto encontrado na planilha.</p>';
        return;
      }

      let htmlTemporario = "";
      dadosProdutos.forEach((p, index) => {
        htmlTemporario += `
          <div class="item-row" id="row-${index}">
            <div style="flex:1; padding-right:5px;"><b>${p.codigo}</b><br><small style="font-size:11px; color:#555;">${p.nome}</small></div>
            <div class="inputs-group">
              <div class="input-box box-estoque"><label>Estoque</label><input type="number" min="0" id="estoque-${index}" oninput="checkInput(${index})" placeholder="0"></div>
              <div class="input-box box-entrada"><label>Entrada</label><input type="number" min="0" id="ent-${index}" oninput="checkInput(${index})" placeholder="0"></div>
              <div class="input-box box-saida"><label>Saída</label><input type="number" min="0" id="sai-${index}" oninput="checkInput(${index})" placeholder="0"></div>
              <div class="input-box box-reposicao"><label>Reposição</label><input type="number" min="0" id="rep-${index}" oninput="checkInput(${index})" placeholder="0"></div>
              <div class="input-box box-quebra"><label>Quebra</label><input type="number" min="0" id="qbr-${index}" oninput="checkInput(${index})" placeholder="0"></div>
            </div>
          </div>`;
      });
      
      lista.innerHTML = htmlTemporario;

    } catch (e) { 
      console.error("Erro no carregamento:", e);
      lista.innerHTML = `
        <div style="text-align:center; padding:12px; color:#d32f2f; background: #fff3f3; border-radius: 8px; border: 1px solid #ffcdd2; margin: 10px;">
          <p style="margin-top:0; font-size:13px;"><b>⚠️ Erro ao ler dados da planilha:</b></p>
          <p style="font-size:11px; text-align:left; background:white; padding:8px; border-radius:4px; word-break:break-word;">${e.message}</p>
          <button onclick="carregarDados()" style="padding:6px 12px; background:#075E54; color:white; border:none; border-radius:4px; cursor:pointer; font-size:12px;">Tentar Novamente</button>
        </div>`; 
    }
  }

  function abrirRevisao() {
    const conferente = document.getElementById('selectConferente').value;
    const obs = document.getElementById('obsGeral').value;
    if (!conferente) return alert("Selecione o conferente!");

    const dataHoraFinal = document.getElementById('dataHoraAtual').innerText;

    let msg = `*RELATÓRIO DE CONFERÊNCIA*\n`;
    msg += `🏢 *CONFERÊNCIA DIGITAL COLMÉIA*\n`;
    msg += `📅 Data/Hora: ${dataHoraFinal}\n`;
    msg += `👤 Conferente: ${conferente}\n`;
    msg += `----------------------------\n\n`;

    let temDados = false;
    dadosProdutos.forEach((p, index) => {
      const e = document.getElementById(`estoque-${index}`).value || 0;
      const en = document.getElementById(`ent-${index}`).value || 0;
      const sa = document.getElementById(`sai-${index}`).value || 0;
      const r = document.getElementById(`rep-${index}`).value || 0;
      const b = document.getElementById(`qbr-${index}`).value || 0;
      
      if (e > 0 || en > 0 || sa > 0 || r > 0 || b > 0) {
        temDados = true;
        msg += `📦 *${p.nome}*\n`;
        
        let infos = [];
        if (e > 0) infos.push(`Estoque: ${e}`);
        if (en > 0) infos.push(`Entrada: ${en}`);
        if (sa > 0) infos.push(`Saída: ${sa}`);
        if (r > 0) infos.push(`Reposição: ${r}`);
        if (b > 0) infos.push(`Quebra: ${b}`);
        
        msg += infos.join(" | ") + `\n\n`; 
      }
    });

    if (obs) msg += `📝 *Obs:* ${obs}\n`;
    if (!temDados) return alert("Preencha ao menos um item!");

    mensagemFinal = msg;
    document.getElementById('corpoRevisao').innerText = msg;
    document.getElementById('modalRevisao').style.display = 'block';
  }

  function fecharRevisao() { document.getElementById('modalRevisao').style.display = 'none'; }

  function limparFormulario() {
    dadosProdutos.forEach((p, index) => {
      const e = document.getElementById(`estoque-${index}`);
      const en = document.getElementById(`ent-${index}`);
      const sa = document.getElementById(`sai-${index}`);
      const r = document.getElementById(`rep-${index}`);
      const b = document.getElementById(`qbr-${index}`);
      
      if(e) e.value = "";
      if(en) en.value = "";
      if(sa) sa.value = "";
      if(r) r.value = "";
      
      if(b) {
        b.value = "";
        b.classList.remove('input-quebra-ativa');
      }
      const row = document.getElementById(`row-${index}`);
      if(row) {
        row.classList.remove('item-preenchido');
      }
    });
    
    document.getElementById('obsGeral').value = "";
    document.getElementById('inputBusca').value = "";
    document.getElementById('selectConferente').value = "";
    
    document.querySelector('.scrollable-content').scrollTop = 0;
    mudarAba('estoque'); 
  }

  function confirmarLimpeza() {
    if(confirm("⚠️ Tem certeza que deseja apagar todos os dados preenchidos? Essa ação não pode ser desfeita.")) {
      limparFormulario();
    }
  }

  function confirmarEEnviar() {
    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagemFinal)}`;
    
    fecharRevisao();
    limparFormulario();
    window.scrollTo(0, 0);
    
    window.location.href = url;
  }

  carregarDados();
</script>

</body>
</html>
